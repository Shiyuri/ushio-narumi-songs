<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="VTuber潮成実の歌った曲をまとめた非公式ファンサイト。歌枠・MV・ショート・コラボなどを検索・一覧できます。">
  <title>潮成実 歌まとめ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/gh/nicknisi/line-seed-jp-css@main/dist/line-seed-jp.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>

<body>
  <header>
    <h1><a href="index.html">潮成実 歌まとめ</a></h1>
    <nav class="nav-admin">
      <a href="index.html">曲一覧</a>
      <a href="add.html" class="nav-admin">曲を追加</a>
    </nav>
  </header>

  <div class="disclaimer">
    <p>非公式ファンサイトです</p>
  </div>

  <main class="container">
    <!-- 検索エリア -->
    <div class="search-area">
      <div class="search-row">
        <div class="search-input-wrapper">
          <input type="text" id="searchInput" class="search-input" placeholder="キーワードで検索...">
          <button type="button" id="clearSearchBtn" class="clear-btn" style="display: none;"
            onclick="clearSearch()">×</button>
        </div>
        <select id="typeFilter" class="filter-select">
          <option value="all">すべて</option>
          <option value="video">動画</option>
          <option value="utawaku">歌枠</option>
          <option value="shorts">ショート</option>
          <option value="external">外部チャンネル</option>
        </select>
        <select id="sortOrder" class="filter-select">
          <option value="date-desc">新しい順</option>
          <option value="date-asc">古い順</option>
        </select>
        <span class="stats" id="stats">読み込み中...</span>
        <button type="button" id="clearAllBtn" class="btn-clear-all" style="visibility: hidden;"
          onclick="clearAllFilters()">クリア</button>
      </div>
    </div>

    <!-- 曲リスト -->
    <div class="song-list" id="songList">
      <div class="loading" id="loadingIndicator">
        <div class="loading-spinner"></div>
        <p>読み込み中...</p>
      </div>
    </div>

    <!-- もっと見るボタン -->
    <button id="loadMoreBtn" class="load-more" style="display: none;">
      もっと見る
    </button>
  </main>

  <!-- 編集モーダル -->
  <div id="editModal" class="modal admin-only" style="display:none;">
    <div class="modal-content">
      <h3>曲を編集</h3>
      <input type="hidden" id="editId">

      <div class="form-group">
        <label>曲名</label>
        <input type="text" id="editTitle">
      </div>

      <div class="form-group">
        <label>アーティスト（カンマ区切り）</label>
        <input type="text" id="editArtist">
      </div>

      <div class="form-group">
        <label>種類</label>
        <select id="editType">
          <option value="video">動画</option>
          <option value="utawaku">歌枠</option>
          <option value="shorts">ショート</option>
          <option value="external">外部チャンネル</option>
        </select>
      </div>

      <div class="form-group">
        <label>日付</label>
        <input type="date" id="editDate">
      </div>

      <div class="form-group">
        <label>動画ID</label>
        <input type="text" id="editVideoId">
      </div>

      <div class="form-group">
        <label>配信タイトル</label>
        <input type="text" id="editStreamTitle">
      </div>

      <div class="form-group">
        <label>タイムスタンプ（秒）</label>
        <input type="number" id="editTimestamp" min="0">
      </div>

      <div class="form-group">
        <label>コラボ相手（カンマ区切り）</label>
        <input type="text" id="editCollabWith">
      </div>

      <div class="form-group">
        <label>備考</label>
        <textarea id="editNotes" rows="2"></textarea>
      </div>

      <div class="modal-buttons">
        <button class="btn btn-primary" onclick="saveEdit()">保存</button>
        <button class="btn btn-secondary" onclick="closeEditModal()">キャンセル</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    // 閲覧専用モード: 管理者向けUIを非表示
    if (READ_ONLY) {
      document.querySelectorAll('.nav-admin, .admin-only').forEach(el => el.style.display = 'none');
    }
  </script>
</body>

</html>
